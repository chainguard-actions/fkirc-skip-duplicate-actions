name: Test paths_ignore input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          paths_ignore: '["**.md", "**.txt"]'
          concurrent_skipping: 'never'
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
      - name: Assert should_skip output exists
        env:
          SHOULD_SKIP: ${{ steps.action.outputs.should_skip }}
          REASON: ${{ steps.action.outputs.reason }}
        run: |
          echo "should_skip: $SHOULD_SKIP"
          echo "reason: $REASON"
          if [ -z "$SHOULD_SKIP" ]; then
            echo "FAIL: should_skip output is empty"
            exit 1
          fi
          echo "PASS: should_skip output is present"
      - name: Assert should_skip is false for workflow_dispatch
        env:
          SHOULD_SKIP: ${{ steps.action.outputs.should_skip }}
        run: |
          echo "should_skip: $SHOULD_SKIP"
          if [ "$SHOULD_SKIP" != "false" ]; then
            echo "FAIL: expected should_skip=false for workflow_dispatch (it is in do_not_skip list)"
            exit 1
          fi
          echo "PASS: should_skip is false as expected"
