name: Test paths_ignore - workflow_dispatch still not skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          paths_ignore: '["**.md", "**.txt", "docs/**"]'
          concurrent_skipping: 'never'
      - name: Assert should_skip is false for workflow_dispatch with paths_ignore
        env:
          SHOULD_SKIP: ${{ steps.action.outputs.should_skip }}
          REASON: ${{ steps.action.outputs.reason }}
        run: |
          echo "should_skip: $SHOULD_SKIP"
          echo "reason: $REASON"
          if [ "$SHOULD_SKIP" != "false" ]; then
            echo "FAIL: expected should_skip=false for workflow_dispatch even with paths_ignore"
            exit 1
          fi
          echo "PASS: should_skip is false as expected"
