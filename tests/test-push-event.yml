name: Test push event with cancel_others
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          cancel_others: 'false'
          skip_after_successful_duplicate: 'true'
          concurrent_skipping: 'never'
          do_not_skip: '["workflow_dispatch", "schedule"]'
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
      - name: Assert should_skip output exists
        env:
          SHOULD_SKIP: ${{ steps.action.outputs.should_skip }}
          REASON: ${{ steps.action.outputs.reason }}
        run: |
          echo "should_skip: $SHOULD_SKIP"
          echo "reason: $REASON"
          if [ -z "$SHOULD_SKIP" ]; then
            echo "FAIL: should_skip output is empty"
            exit 1
          fi
          echo "PASS: should_skip output is present"
      - name: Assert reason output exists
        env:
          REASON: ${{ steps.action.outputs.reason }}
        run: |
          echo "reason: $REASON"
          if [ -z "$REASON" ]; then
            echo "FAIL: reason output is empty"
            exit 1
          fi
          echo "PASS: reason output is present"
