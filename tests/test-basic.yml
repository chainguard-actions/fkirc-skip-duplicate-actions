name: Test basic usage - workflow_dispatch not skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          concurrent_skipping: 'never'
          # workflow_dispatch is in do_not_skip by default, so should_skip should be false
      - name: Assert should_skip is false or action failed gracefully on sentinel repo
        env:
          SHOULD_SKIP: ${{ steps.action.outputs.should_skip }}
          REASON: ${{ steps.action.outputs.reason }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_skip: $SHOULD_SKIP"
          echo "reason: $REASON"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$SHOULD_SKIP" = "false" ]; then
              echo "PASS: should_skip is false as expected for workflow_dispatch"
            elif [ -z "$SHOULD_SKIP" ]; then
              echo "FAIL: action succeeded but should_skip output is empty"
              exit 1
            else
              echo "FAIL: expected should_skip=false but got '$SHOULD_SKIP'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
