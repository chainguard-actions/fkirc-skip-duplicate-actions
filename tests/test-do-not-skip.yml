name: Test do_not_skip input configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-with-do-not-skip
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          concurrent_skipping: 'never'
          cancel_others: 'false'
          skip_after_successful_duplicate: 'true'
          # Keep workflow_dispatch in do_not_skip (default behavior)
          do_not_skip: '["workflow_dispatch", "schedule"]'
      - name: Assert action ran with do_not_skip including workflow_dispatch
        env:
          SHOULD_SKIP: ${{ steps.action-with-do-not-skip.outputs.should_skip }}
          REASON: ${{ steps.action-with-do-not-skip.outputs.reason }}
          OUTCOME: ${{ steps.action-with-do-not-skip.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_skip: $SHOULD_SKIP"
          echo "reason: $REASON"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$SHOULD_SKIP" = "false" ]; then
              echo "PASS: should_skip is false as expected (workflow_dispatch in do_not_skip)"
            elif [ -z "$SHOULD_SKIP" ]; then
              echo "FAIL: action succeeded but should_skip output is empty"
              exit 1
            else
              echo "FAIL: expected should_skip=false but got '$SHOULD_SKIP'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
