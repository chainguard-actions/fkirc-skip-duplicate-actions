name: Test skip_after_successful_duplicate=false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          skip_after_successful_duplicate: 'false'
          concurrent_skipping: 'never'
      - name: Assert should_skip is false and reason is set
        env:
          SHOULD_SKIP: ${{ steps.action.outputs.should_skip }}
          REASON: ${{ steps.action.outputs.reason }}
        run: |
          echo "should_skip: $SHOULD_SKIP"
          echo "reason: $REASON"
          if [ "$SHOULD_SKIP" != "false" ]; then
            echo "FAIL: expected should_skip=false"
            exit 1
          fi
          if [ -z "$REASON" ]; then
            echo "FAIL: expected reason to be non-empty"
            exit 1
          fi
          echo "PASS: should_skip=false and reason='$REASON'"
